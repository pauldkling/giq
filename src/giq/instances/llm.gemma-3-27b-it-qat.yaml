# Gemma 3 has no thinking mode, so the default `--reasoning off` is its
# natural setting. The weights follow LM Studio's own layout, hence the
# `~` path.
name: gemma-3-27b-it-qat
worker: llm
engine: llama.cpp
weights:
  path: ~/.lmstudio/models/lmstudio-community/gemma-3-27B-it-qat-GGUF/gemma-3-27B-it-QAT-Q4_0.gguf
  format: gguf
capabilities: [chat]
vram:
  gb: 18.0
  measured: false
max_batch: 32
