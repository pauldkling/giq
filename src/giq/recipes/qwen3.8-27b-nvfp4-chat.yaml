# The same NVFP4 checkpoint as llm/qwen3.8-27b-nvfp4, tuned for one person
# waiting on an answer rather than for many at once. Speculative decoding
# drafts with the checkpoint's own multi-token-prediction head: measured on
# an RTX 5090, three draft tokens took one request from 72 to 117 tok/s but
# the total at 16 parallel requests from 937 down to 750, accepting 0.66,
# 0.37 and 0.17 by draft position. The interactive profile drafts two and
# schedules at most four requests.
#
# Two recipes over one checkpoint share the card: asking for one evicts
# the other through the ordinary swap. Not resident by default, like its
# sibling.
name: qwen3.8-27b-nvfp4-chat
modalities: [llm]
engine: vllm
label: Qwen3.8 27B NVFP4 (interactive)
detail: "chat + vision · vllm · MTP · up to 4 in parallel · 128k ctx"
weights:
  path: nvidia-Qwen3.8-27B-NVFP4
  source: hf:nvidia/Qwen3.8-27B-NVFP4
  revision: 482ca0f3832238542f8f5295dde86b5f22711d80
  format: modelopt
  licence: apache-2.0
capabilities: [chat, vision]
# MTP with 2 draft tokens, up to 4 requests, an 8192-token scheduling budget.
profile: interactive
params:
  # A gigabyte less KV than the throughput recipe: the MTP head's weights
  # and its own KV come out of the same card. 5 GiB is ~150k tokens, more
  # than four requests at a time need.
  kv_cache_memory: 5G
  max_model_len: 131072
  kv_cache_dtype: fp8
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder
vram:
  # Loaded weights including the MTP head, + KV budget + overhead.
  weights_gb: 20.73
  overhead_gb: 3.5
  measured: false
max_batch: 32
