name: qwen-coder-30b
worker: llm
engine: llama.cpp
weights:
  path: ~/.lmstudio/models/lmstudio-community/Qwen3-Coder-30B-A3B-Instruct-GGUF/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
  format: gguf
capabilities: [chat]
# Instruct, not thinking: a reasoning budget would be inert, and Qwen's
# sampling guidance for it differs. DRY still applies — a coder model
# repeating a block is the same failure wearing different clothes. The
# values are qwen3.8-27b's, where each is explained.
request_defaults:
  dry_multiplier: 0.8
  dry_base: 1.75
  dry_allowed_length: 4
  dry_penalty_last_n: 4096
vram:
  gb: 20.0
  measured: false
max_batch: 32
