# Depth Anything 3: any-view geometry. N images in, per-view depth + camera
# poses + intrinsics out in one shared frame — what a scan needs and what the
# single-image depth worker cannot give. Runs on the `da3` engine (envs/da3)
# because the package pins numpy<2 and carries a research toolkit; see
# workers/multiview.py. The snapshot (config.json + model.safetensors) is
# loaded by path with the hub disabled, under GIQ_MULTIVIEW_MODELS_DIR when
# that is set.
#
# Licences: DA3-BASE is Apache-2.0 everywhere. DA3-LARGE-1.1 has no
# recipe: its model card says Apache-2.0 while the repository README's
# table lists Large as CC BY-NC 4.0 (as the pre-1.1 DA3-LARGE card does), and
# a licence that unclear is not one to offer for commercial use.
name: da3-base
label: Depth Anything 3 Base
worker: multiview
engine: da3
detail: "any-view depth + poses · ViT-B 0.12B · Apache-2.0 · ≤32 views"
weights:
  path: depth-anything-DA3-BASE
  source: hf:depth-anything/DA3-BASE
  revision: f4a6c9b
  format: safetensors
  licence: apache-2.0
vram:
  # VRAM grows with the total token count (full attention across views),
  # which the child caps at 32 views and 41472 patch tokens — exactly 32
  # square views at 504 px, the worst case it lets through. Standalone child,
  # nvidia-smi sampled every 50 ms through the call: 1068 MiB idle after
  # load; 1750 MiB peak at 2 views (1208x680 inputs), 4404 at 32 such views,
  # 6602 at 32 square views. Declared above the square-view peak. The child
  # hands the allocator's cache back after every task, so idle returns to
  # ~1.4 GiB.
  gb: 7.0
  measured: true
  measured_on: NVIDIA GeForce RTX 5090
max_batch: 1
