# Qwen3.8-27B as NVIDIA quantised it (ModelOpt NVFP4 weights, some layers
# FP8), served by vllm for many users at once. The same model as
# llm/qwen3.8-27b under llama.cpp; this one is the throughput recipe.
# Measured on an RTX 5090 at 256 generated tokens per request: 72 tok/s for
# one request, 937 tok/s in total at 16 parallel, where one llama-server
# slot gives 56 tok/s at any load.
#
# Not resident by default: vllm takes minutes to start (192 s cold, 82 s
# warm), so an operator who wants it pins it rather than paying a cold start
# on some user's first request.
name: qwen3.8-27b-nvfp4
modalities: [llm]
engine: vllm
label: Qwen3.8 27B NVFP4
detail: "chat + vision · vllm · up to 32 in parallel · 128k ctx"
weights:
  path: nvidia-Qwen3.8-27B-NVFP4
  source: hf:nvidia/Qwen3.8-27B-NVFP4
  revision: 482ca0f3832238542f8f5295dde86b5f22711d80
  format: modelopt
  licence: apache-2.0
capabilities: [chat, vision]
# No speculation, up to 32 requests over one paged KV pool, fp8 KV.
profile: throughput
params:
  # The budget is a KV size, not a fraction of the card, so it means the same
  # on a 32 GB RTX 5090 and a 96 GB RTX PRO 6000. 6 GiB of fp8 KV holds
  # about 180k tokens (36 KiB per token): one full 128k request and change,
  # or 32 requests averaging 5.6k — and keeps the whole recipe loadable on
  # a 32 GB card through giq's gate with its 2 GB margin. On a bigger card,
  # replace this file in the recipes directory with a larger budget (and a
  # vram figure to match) rather than a fraction.
  kv_cache_memory: 6G
  # 128k, not the native 256k: a full-length request must fit the pool.
  max_model_len: 131072
  kv_cache_dtype: fp8
  # Qwen3.x thinks between <think> tags; the parser moves the thought to its
  # own channel (giq relays it as reasoning_content). Tool calls come as
  # Qwen3-Coder's XML <function=…> blocks, which is what its chat template
  # asks for.
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder
# Sampling needs no defaults here: vllm applies the checkpoint's
# generation_config.json (Qwen's top_k 20, top_p 0.95) under each request.
vram:
  # Loaded weights (vllm's own figure; the MTP head is not loaded without
  # speculation) + the KV budget + everything else the process holds.
  weights_gb: 19.92
  overhead_gb: 3.5
  measured: false
max_batch: 32
