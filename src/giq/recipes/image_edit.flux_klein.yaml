# klein does kontext-style reference edits through sd.cpp (extra_images),
# which fits the edit modality on a 16 GB card. Same weights and figure as
# text2image/flux_klein, whose file says where the VAE must come from for
# commercial use.
name: flux_klein
worker: image_edit
engine: sd.cpp
weights:
  licence: apache-2.0
  parts:
    diffusion: diffusion_models/flux-2-klein-4b.safetensors
    text_encoder: text_encoders/qwen_3_4b_flux2_klein.safetensors
    vae: {path: vae/flux2-vae.safetensors, licence: apache-2.0}
vram:
  gb: 8.0
  measured: true
max_batch: 4
