name: qwen3.6-27b
worker: llm
engine: llama.cpp
weights:
  path: unsloth-Qwen3.6-27B-GGUF/Qwen3.6-27B-UD-Q5_K_XL.gguf
  format: gguf
capabilities: [chat]
params:
  # Qwen3.6 has 16/64 full-attention layers (hybrid arch) and a native max of
  # 262144, so 256k KV fits the 32 GB card even on the conservative
  # assumption that llama.cpp allocates KV for every layer. The KV cache
  # stays at the q4_0 default, which is what keeps 256k affordable.
  ctx_size: 262144
  reasoning: "on"
# Qwen's thinking-mode sampling, as in qwen3.8-27b, where each field's
# reasoning is written out.
request_defaults:
  dry_multiplier: 0.8
  dry_base: 1.75
  dry_allowed_length: 4
  dry_penalty_last_n: 4096
  top_k: 20
  min_p: 0.0
  reasoning_budget_tokens: 24576
vram:
  gb: 24.0
  measured: false
max_batch: 32
