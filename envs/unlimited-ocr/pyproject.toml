[project]
name = "giq-env-unlimited-ocr"
version = "0.1.0"
description = "Interpreter for giq's unlimited-ocr child: transformers 4.57, which its remote code was written against"
requires-python = ">=3.11,<3.12"
dependencies = [
    # baidu/Unlimited-OCR ships trust_remote_code modeling files written
    # against transformers 4.57 (tested upstream on 4.57.1). On 5.x they load
    # with shims but generation fails inside the custom decoder (a causal-mask
    # width mismatch against 5.x's prefill), so the model keeps the line it
    # was built for. Everything else in giq moved to transformers 5 for
    # GLM-OCR; this is the one child spawned with a different interpreter.
    "transformers>=4.57.1,<4.58",
    # Same torch line as giq's own venv, so CUDA 13 driver, same measured VRAM.
    "torch>=2.11.0,<2.12.0",
    "torchvision>=0.26.0,<0.27.0",
    # The remote code's imports.
    "easydict>=1.13",
    "addict>=2.4.0",
    "pillow>=12.1.1",
    "numpy>=2.0",
    "tqdm>=4.66",
    "matplotlib>=3.10",
    "einops>=0.8",
    # The child's own needs.
    "pypdfium2>=4.30.0",
    # What importing giq.workers.ocr / giq.workers._subprocess pulls in.
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "httpx>=0.28",
]
