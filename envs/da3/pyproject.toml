[project]
name = "giq-env-da3"
version = "0.1.0"
description = "Interpreter for giq's multiview child: Depth Anything 3 and the dependency set it declares"
requires-python = ">=3.11,<3.12"
dependencies = [
    # ByteDance-Seed/depth-anything-3, pinned to a reviewed commit. Not on
    # PyPI. Its declared dependencies are a research
    # toolkit (open3d, pycolmap, evo, e3nn, moviepy, trimesh, a numpy<2 pin)
    # that giq's own venv has no business carrying, and the numpy pin alone
    # would break it — so the child gets its own interpreter, exactly like
    # unlimited-ocr. The model code itself is plain torch: attention is
    # F.scaled_dot_product_attention, and xformers is only reached for the
    # SwiGLU FFN of the Giant models, which are not registered.
    "depth-anything-3 @ git+https://github.com/ByteDance-Seed/depth-anything-3.git@3d835ec1a5802d64a8b8b15f817a1ab54809bfe4",
    # Same torch line as giq's own venv (PyPI's 2.11 wheels are cu130), so the
    # same CUDA 13 driver and comparable VRAM figures.
    "torch>=2.11.0,<2.12.0",
    "torchvision>=0.26.0,<0.27.0",
    # What importing giq.adapters.multiview / giq.adapters._subprocess pulls in.
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "pillow>=10",
]

[tool.uv]
# xformers ships wheels built against one torch minor at a time and is not
# needed for the models registered here (see above); a wheel for another
# torch would import-fail at worst and silently mismatch at best. Excluded.
override-dependencies = [
    "xformers ; sys_platform == 'never'",
]
